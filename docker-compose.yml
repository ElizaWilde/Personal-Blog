services:
  astrowind:
    build: .
    container_name: astrowind
    ports:
      - 8080:8080

  formatter:
    profiles: [tools]
    build:
      context: .
      target: deps
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    entrypoint: [node, node_modules/prettier/bin/prettier.cjs]
    command: [--write, .]
